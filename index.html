<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вектор — Автошкола</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #0a0a0a;
  color: #fff;
  padding: 20px;
  min-height: 100vh;
}

.box {
  max-width: 500px;
  margin: 0 auto;
  background: #141414;
  padding: 25px;
  border-radius: 12px;
  border: 1px solid #222;
}

.logo-wrap { text-align: center; margin-bottom: 20px; }
.logo { width: 260px; height: auto; }

h2 { font-size: 18px; margin: 20px 0 10px; color: #fff; }
h2.yellow { color: #f5d742; }

button {
  padding: 14px; width: 100%; margin: 8px 0;
  border: none; border-radius: 8px;
  font-size: 16px; font-weight: 600; cursor: pointer;
  transition: all 0.2s;
}
.btn-yellow { background: #f5d742; color: #000; }
.btn-yellow:hover { background: #ffe066; transform: translateY(-1px); }
.btn-black { background: #1a1a1a; color: #f5d742; border: 2px solid #f5d742; }
.btn-black:hover { background: #f5d742; color: #000; }
.btn-danger { background: #ff3b3b; color: #fff; padding: 8px 12px; width: auto; font-size: 14px; }

input {
  padding: 14px; width: 100%; margin: 8px 0;
  background: #0a0a0a; border: 2px solid #222;
  border-radius: 8px; color: #fff; font-size: 15px; box-sizing: border-box;
}
input:focus { outline: none; border-color: #f5d742; }
input::placeholder { color: #555; }

.tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.tab {
  flex: 1; padding: 12px;
  background: #1a1a1a; color: #666;
  border: 2px solid #222; border-radius: 8px;
  font-weight: 700; cursor: pointer; font-size: 15px;
}
.tab.active { background: #f5d742; color: #000; border-color: #f5d742; }

.item {
  padding: 12px; background: #1a1a1a;
  margin: 5px 0; border-radius: 8px;
  border-left: 3px solid #f5d742;
  display: flex; justify-content: space-between; align-items: center;
}
.item span { color: #fff; }
.item small { color: #888; }

.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
.slot {
  padding: 12px; text-align: center;
  background: #1a1a1a; border: 2px solid #333;
  border-radius: 6px; cursor: pointer;
  font-size: 14px; color: #fff; font-weight: 600;
}
.slot:hover { border-color: #f5d742; }
.slot.sel { background: #f5d742; color: #000; border-color: #f5d742; }
.slot.busy { background: #0a0a0a; color: #444; text-decoration: line-through; cursor: not-allowed; border-color: #222; }

.hidden { display: none !important; }

.modal {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.8);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
.modal-box {
  background: #141414; padding: 25px;
  border-radius: 12px; max-width: 350px; width: 90%;
  border: 1px solid #f5d742; text-align: center;
}
.modal-box h2 { color: #f5d742; margin-bottom: 15px; }
.modal-box p { color: #ccc; margin-bottom: 15px; line-height: 1.5; }

.welcome { text-align: center; padding: 15px 0; }
.welcome-icon { font-size: 50px; margin-bottom: 10px; }
.divider { height: 1px; background: #222; margin: 15px 0; }
.badge {
  display: inline-block; background: #f5d742; color: #000;
  padding: 3px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 700; margin-left: 8px;
}

/* ===== СЦЕНА С ДОРОГОЙ ===== */
.scene {
  position: relative;
  width: 100%;
  height: 300px;
  margin-top: 20px;
  overflow: hidden;
  border-radius: 8px;
  background: #0d0d0d;
}

/* Дорога SVG */
.road-svg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}

/* Машина едет по дороге */
.car-moving {
  position: absolute;
  width: 80px;
  height: 40px;
  offset-path: path('M 480 20 Q 380 100 280 180 Q 180 260 100 260 Q 60 260 60 220 Q 60 180 100 180 Q 180 180 260 180 L 380 180');
  offset-rotate: auto;
  animation: driveCar 7s ease-in-out forwards;
  opacity: 0;
}

@keyframes driveCar {
  0% { offset-distance: 0%; opacity: 0; }
  3% { opacity: 1; }
  75% { offset-distance: 80%; }
  85% { offset-distance: 80%; }
  95% { offset-distance: 85%; }
  100% { offset-distance: 85%; opacity: 1; }
}

/* Фары */
.headlight {
  animation: headlightPulse 0.6s ease-in-out infinite alternate;
}
@keyframes headlightPulse {
  from { opacity: 0.7; }
  to { opacity: 1; }
}

/* Парковка */
.parking-area {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 140px;
  height: 70px;
  opacity: 0;
  animation: showParking 0.5s ease forwards;
  animation-delay: 5.5s;
}

@keyframes showParking {
  to { opacity: 1; }
}

/* Машина паркуется задним ходом */
.car-parking {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 40px;
  opacity: 0;
  animation: reversePark 2.5s ease-in-out forwards;
  animation-delay: 5.5s;
}

@keyframes reversePark {
  0% {
    opacity: 1;
    transform: translateX(-50%) translateY(40px) rotate(20deg);
  }
  30% {
    transform: translateX(-50%) translateY(20px) rotate(-10deg);
  }
  60% {
    transform: translateX(-50%) translateY(10px) rotate(5deg);
  }
  100% {
    opacity: 1;
    transform: translateX(-50%) translateY(0) rotate(0deg);
  }
}

/* Стоп-сигналы при парковке */
.brake-light {
  animation: brakeFlash 0.4s ease-in-out 4;
  animation-delay: 5.5s;
}
@keyframes brakeFlash {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}
</style>
</head>
<body>

<div class="box">

  <!-- ЛОГОТИП -->
  <div class="logo-wrap">
    <svg class="logo" viewBox="0 0 280 110" xmlns="http://www.w3.org/2000/svg">
      <!-- Жёлтый ромб -->
      <rect x="10" y="15" width="75" height="75" rx="8" fill="#f5d742" transform="rotate(45 47 52)"/>
      <!-- Буква V как стрелка-дорога -->
      <path d="M 25 70 L 40 45 L 47 55 L 62 20" stroke="#000" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Пунктир на стрелке -->
      <line x1="33" y1="60" x2="55" y2="28" stroke="#fff" stroke-width="2" stroke-dasharray="4,3"/>
      <!-- Текст Vектор -->
      <text x="95" y="60" font-size="42" font-weight="900" fill="#000" font-family="Arial">Vектор</text>
      <!-- Текст СЕТЬ АВТОШКОЛ -->
      <text x="130" y="82" font-size="14" fill="#666" letter-spacing="2" font-family="Arial">СЕТЬ АВТОШКОЛ</text>
    </svg>
  </div>

  <div class="tabs">
    <button class="tab" onclick="openAdmin()">🔒 АДМИН</button>
    <button class="tab active" onclick="showStudent()">🎓 УЧЕНИК</button>
  </div>

  <!-- АДМИН -->
  <div id="admin" class="hidden">
    <h2 class="yellow">Добавить ученика</h2>
    <input id="fio" placeholder="ФИО ученика">
    <button class="btn-yellow" onclick="addStudent()">Добавить</button>
    <div class="divider"></div>
    <h2>Список допущенных <span class="badge" id="stCount">0</span></h2>
    <div id="list"></div>
    <div class="divider"></div>
    <h2>Записи на экзамен <span class="badge" id="bkCount">0</span></h2>
    <div id="book"></div>
    <div class="divider"></div>
    <button class="btn-black" onclick="logout()">Выйти из админки</button>
  </div>

  <!-- УЧЕНИК -->
  <div id="stu">
    <div id="s1">
      <div class="welcome">
        <div class="welcome-icon"></div>
        <h2 class="yellow">Запись на экзамен по теории</h2>
        <p style="color:#888; margin-top:8px;">Введите ФИО для проверки допуска</p>
      </div>
      <input id="sfio" placeholder="Иванов Иван Иванович">
      <button class="btn-yellow" onclick="checkStudent()">Проверить допуск</button>
      
      <!-- СЦЕНА С ДОРОГОЙ И МАШИНОЙ -->
      <div class="scene" id="scene">
        
        <!-- Дорога -->
        <svg class="road-svg" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
          <!-- Асфальт дороги -->
          <path d="M 500 20 Q 380 100 280 180 Q 180 260 100 260 Q 60 260 60 220 Q 60 180 100 180 Q 180 180 260 180 L 400 180" 
                stroke="#3a3a3a" stroke-width="55" fill="none" stroke-linecap="round"/>
          <!-- Обочина -->
          <path d="M 500 20 Q 380 100 280 180 Q 180 260 100 260 Q 60 260 60 220 Q 60 180 100 180 Q 180 180 260 180 L 400 180" 
                stroke="#2a2a2a" stroke-width="62" fill="none" stroke-linecap="round" opacity="0.6"/>
          <!-- Жёлтая пунктирная разметка -->
          <path d="M 500 20 Q 380 100 280 180 Q 180 260 100 260 Q 60 260 60 220 Q 60 180 100 180 Q 180 180 260 180 L 400 180" 
                stroke="#f5d742" stroke-width="2" fill="none" 
                stroke-dasharray="18,12" stroke-linecap="round"/>
          <!-- Белая сплошная по краю -->
          <path d="M 500 20 Q 380 100 280 180 Q 180 260 100 260 Q 60 260 60 220 Q 60 180 100 180 Q 180 180 260 180 L 400 180" 
                stroke="#fff" stroke-width="1" fill="none" opacity="0.3"
                transform="translate(0, -24)"/>
        </svg>

        <!-- Машина едет -->
        <div class="car-moving" id="carMoving">
          <svg viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
            <!-- Тень -->
            <ellipse cx="50" cy="47" rx="42" ry="3" fill="#000" opacity="0.5"/>
            <!-- Кузов Лада Гранта -->
            <path d="M 8 30 Q 8 25 14 25 L 24 25 L 32 14 Q 35 10 42 10 L 70 10 Q 76 10 79 14 L 86 25 L 94 25 Q 97 25 97 30 L 97 36 Q 97 39 94 39 L 8 39 Q 5 39 5 36 L 5 33 Q 5 30 8 30 Z" 
                  fill="#f5f5f5" stroke="#ccc" stroke-width="0.5"/>
            <!-- Крыша -->
            <path d="M 32 14 Q 35 10 42 10 L 70 10 Q 76 10 79 14 L 82 20 L 30 20 Z" fill="#e8e8e8"/>
            <!-- Лобовое стекло -->
            <path d="M 36 12 L 42 11 L 68 11 L 76 12 L 78 19 L 34 19 Z" fill="#4a6fa5" opacity="0.85"/>
            <!-- Боковые стёкла -->
            <rect x="38" y="13" width="14" height="6" rx="1" fill="#4a6fa5" opacity="0.8"/>
            <rect x="56" y="13" width="16" height="6" rx="1" fill="#4a6fa5" opacity="0.8"/>
            <!-- Решётка радиатора -->
            <rect x="90" y="27" width="6" height="9" rx="1.5" fill="#222"/>
            <line x1="92" y1="29" x2="95" y2="29" stroke="#444" stroke-width="0.5"/>
            <line x1="92" y1="32" x2="95" y2="32" stroke="#444" stroke-width="0.5"/>
            <!-- Фары ближнего света -->
            <ellipse cx="95" cy="30" rx="3" ry="2.5" fill="#fffacd" class="headlight"/>
            <ellipse cx="95" cy="30" rx="5" ry="4" fill="#fffacd" opacity="0.4" class="headlight"/>
            <!-- Луч фары -->
            <polygon points="98,28 110,24 110,36 98,32" fill="#fffacd" opacity="0.3" class="headlight"/>
            <!-- Задние фонари -->
            <rect x="6" y="28" width="3" height="5" rx="0.5" fill="#cc0000" class="brake-light"/>
            <!-- Колёса -->
            <circle cx="22" cy="40" r="6" fill="#1a1a1a"/>
            <circle cx="22" cy="40" r="3.5" fill="#333"/>
            <circle cx="22" cy="40" r="1.5" fill="#666"/>
            <circle cx="78" cy="40" r="6" fill="#1a1a1a"/>
            <circle cx="78" cy="40" r="3.5" fill="#333"/>
            <circle cx="78" cy="40" r="1.5" fill="#666"/>
            <!-- Бамперы -->
            <rect x="92" y="34" width="6" height="3" rx="1" fill="#ddd"/>
            <rect x="4" y="34" width="5" height="3" rx="1" fill="#ddd"/>
            <!-- Дверные ручки -->
            <rect x="44" y="23" width="4" height="1" rx="0.3" fill="#bbb"/>
            <rect x="60" y="23" width="4" height="1" rx="0.3" fill="#bbb"/>
          </svg>
        </div>

        <!-- Парковка -->
        <div class="parking-area" id="parkingArea">
          <svg viewBox="0 0 140 70" xmlns="http://www.w3.org/2000/svg">
            <!-- Асфальт парковки -->
            <rect x="0" y="0" width="140" height="70" fill="#2a2a2a" rx="3"/>
            <!-- Разметка ёлочка -->
            <line x1="15" y1="70" x2="35" y2="25" stroke="#f5d742" stroke-width="2.5"/>
            <line x1="35" y1="70" x2="55" y2="25" stroke="#f5d742" stroke-width="2.5"/>
            <line x1="55" y1="70" x2="75" y2="25" stroke="#f5d742" stroke-width="2.5"/>
            <line x1="75" y1="70" x2="95" y2="25" stroke="#f5d742" stroke-width="2.5"/>
            <line x1="95" y1="70" x2="115" y2="25" stroke="#f5d742" stroke-width="2.5"/>
            <!-- Рамка парковочного места -->
            <rect x="30" y="10" width="80" height="55" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="5,3" rx="2"/>
          </svg>
        </div>

        <!-- Машина паркуется задним ходом -->
        <div class="car-parking" id="carParking">
          <svg viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="50" cy="47" rx="42" ry="3" fill="#000" opacity="0.5"/>
            <path d="M 8 30 Q 8 25 14 25 L 24 25 L 32 14 Q 35 10 42 10 L 70 10 Q 76 10 79 14 L 86 25 L 94 25 Q 97 25 97 30 L 97 36 Q 97 39 94 39 L 8 39 Q 5 39 5 36 L 5 33 Q 5 30 8 30 Z" 
                  fill="#f5f5f5" stroke="#ccc" stroke-width="0.5"/>
            <path d="M 32 14 Q 35 10 42 10 L 70 10 Q 76 10 79 14 L 82 20 L 30 20 Z" fill="#e8e8e8"/>
            <path d="M 36 12 L 42 11 L 68 11 L 76 12 L 78 19 L 34 19 Z" fill="#4a6fa5" opacity="0.85"/>
            <rect x="38" y="13" width="14" height="6" rx="1" fill="#4a6fa5" opacity="0.8"/>
            <rect x="56" y="13" width="16" height="6" rx="1" fill="#4a6fa5" opacity="0.8"/>
            <rect x="90" y="27" width="6" height="9" rx="1.5" fill="#222"/>
            <line x1="92" y1="29" x2="95" y2="29" stroke="#444" stroke-width="0.5"/>
            <line x1="92" y1="32" x2="95" y2="32" stroke="#444" stroke-width="0.5"/>
            <ellipse cx="95" cy="30" rx="3" ry="2.5" fill="#fffacd" class="headlight"/>
            <ellipse cx="95" cy="30" rx="5" ry="4" fill="#fffacd" opacity="0.4" class="headlight"/>
            <polygon points="98,28 110,24 110,36 98,32" fill="#fffacd" opacity="0.3" class="headlight"/>
            <rect x="6" y="28" width="3" height="5" rx="0.5" fill="#cc0000" class="brake-light"/>
            <circle cx="22" cy="40" r="6" fill="#1a1a1a"/>
            <circle cx="22" cy="40" r="3.5" fill="#333"/>
            <circle cx="22" cy="40" r="1.5" fill="#666"/>
            <circle cx="78" cy="40" r="6" fill="#1a1a1a"/>
            <circle cx="78" cy="40" r="3.5" fill="#333"/>
            <circle cx="78" cy="40" r="1.5" fill="#666"/>
            <rect x="92" y="34" width="6" height="3" rx="1" fill="#ddd"/>
            <rect x="4" y="34" width="5" height="3" rx="1" fill="#ddd"/>
            <rect x="44" y="23" width="4" height="1" rx="0.3" fill="#bbb"/>
            <rect x="60" y="23" width="4" height="1" rx="0.3" fill="#bbb"/>
          </svg>
        </div>

      </div>
    </div>

    <!-- ШАГ 2 -->
    <div id="s2" class="hidden">
      <h2 class="yellow">Выберите дату экзамена</h2>
      <input type="date" id="sdate" onchange="renderSlots()">
      <div id="sbox" class="hidden">
        <h2>Свободное время</h2>
        <div id="slots" class="slots"></div>
        <button class="btn-yellow" onclick="bookExam()">Записаться</button>
      </div>
    </div>

    <!-- НЕ ДОПУЩЕН -->
    <div id="s3" class="hidden">
      <div class="welcome">
        <div class="welcome-icon">️</div>
        <h2 class="yellow">Вы не допущены к экзамену</h2>
        <p style="color:#888; margin-top:8px;">Обратитесь к менеджеру автошколы «Вектор»</p>
      </div>
      <button class="btn-black" onclick="backToStart()">Назад</button>
    </div>
  </div>
</div>

<!-- МОДАЛКА ПАРОЛЯ -->
<div id="pwd" class="modal hidden">
  <div class="modal-box">
    <h2>🔐 Вход в админ-панель</h2>
    <p>Введите пароль</p>
    <input type="password" id="pw" placeholder="Пароль">
    <div id="err" style="color:#ff3b3b; margin:5px 0; font-size:14px;"></div>
    <button class="btn-yellow" onclick="checkPwd()">Войти</button>
    <button class="btn-black" onclick="closePwd()">Отмена</button>
  </div>
</div>

<!-- МОДАЛКА ПОДТВЕРЖДЕНИЯ -->
<div id="conf" class="modal hidden">
  <div class="modal-box">
    <h2>Подтвердить запись?</h2>
    <p id="cinfo"></p>
    <button class="btn-yellow" onclick="confirmBook()">Да, записаться</button>
    <button class="btn-black" onclick="closeConf()">Отмена</button>
  </div>
</div>

<script>
var students = [];
var bookings = [];
var loggedIn = false;
var curStudent = null;
var selTime = null;

function load() {
  students = JSON.parse(localStorage.getItem('st') || '[]');
  bookings = JSON.parse(localStorage.getItem('bk') || '[]');
  loggedIn = sessionStorage.getItem('adm') === '1';
}

function save() {
  localStorage.setItem('st', JSON.stringify(students));
  localStorage.setItem('bk', JSON.stringify(bookings));
}

function showAdmin() {
  document.getElementById('admin').classList.remove('hidden');
  document.getElementById('stu').classList.add('hidden');
  renderAdmin();
}

function showStudent() {
  document.getElementById('admin').classList.add('hidden');
  document.getElementById('stu').classList.remove('hidden');
  document.getElementById('s1').classList.remove('hidden');
  document.getElementById('s2').classList.add('hidden');
  document.getElementById('s3').classList.add('hidden');
  document.getElementById('sfio').value = '';
  // Перезапуск анимации
  restartAnimation();
}

function restartAnimation() {
  var carMoving = document.getElementById('carMoving');
  var carParking = document.getElementById('carParking');
  var parkingArea = document.getElementById('parkingArea');
  
  carMoving.style.animation = 'none';
  carParking.style.animation = 'none';
  parkingArea.style.animation = 'none';
  
  setTimeout(function() {
    carMoving.style.animation = '';
    carParking.style.animation = '';
    parkingArea.style.animation = '';
  }, 100);
}

function openAdmin() {
  if (loggedIn) {
    showAdmin();
  } else {
    document.getElementById('pwd').classList.remove('hidden');
    document.getElementById('pw').value = '';
    document.getElementById('err').textContent = '';
  }
}

function checkPwd() {
  if (document.getElementById('pw').value === '0000') {
    loggedIn = true;
    sessionStorage.setItem('adm', '1');
    document.getElementById('pwd').classList.add('hidden');
    showAdmin();
  } else {
    document.getElementById('err').textContent = 'Неверный пароль';
  }
}

function closePwd() {
  document.getElementById('pwd').classList.add('hidden');
}

function logout() {
  loggedIn = false;
  sessionStorage.setItem('adm', '0');
  showStudent();
}

function addStudent() {
  var f = document.getElementById('fio').value.trim();
  if (!f) { alert('Введите ФИО'); return; }
  students.push({id: Date.now(), fio: f});
  save();
  document.getElementById('fio').value = '';
  renderAdmin();
  alert('Ученик добавлен');
}

function renderAdmin() {
  document.getElementById('stCount').textContent = students.length;
  document.getElementById('bkCount').textContent = bookings.length;

  var h = '';
  for (var i = 0; i < students.length; i++) {
    h += '<div class="item"><span>' + students[i].fio + '</span><button class="btn-danger" onclick="delSt(' + students[i].id + ')">×</button></div>';
  }
  document.getElementById('list').innerHTML = h || '<p style="color:#555;">Список пуст</p>';

  var h2 = '';
  for (var j = 0; j < bookings.length; j++) {
    var d = new Date(bookings[j].date).toLocaleDateString('ru-RU');
    h2 += '<div class="item"><span>' + bookings[j].fio + '<br><small>📅 ' + d + ' в ' + bookings[j].time + '</small></span></div>';
  }
  document.getElementById('book').innerHTML = h2 || '<p style="color:#555;">Записей нет</p>';
}

function delSt(id) {
  if (confirm('Удалить ученика?')) {
    students = students.filter(function(s) { return s.id !== id; });
    save();
    renderAdmin();
  }
}

function checkStudent() {
  var f = document.getElementById('sfio').value.trim().toLowerCase();
  if (!f) { alert('Введите ФИО'); return; }

  var found = null;
  for (var i = 0; i < students.length; i++) {
    if (students[i].fio.toLowerCase() === f) {
      found = students[i];
      break;
    }
  }

  if (found) {
    curStudent = found;
    document.getElementById('s1').classList.add('hidden');
    document.getElementById('s2').classList.remove('hidden');
    var t = new Date().toISOString().split('T')[0];
    document.getElementById('sdate').value = t;
    document.getElementById('sdate').min = t;
    renderSlots();
  } else {
    document.getElementById('s1').classList.add('hidden');
    document.getElementById('s3').classList.remove('hidden');
  }
}

function backToStart() {
  document.getElementById('s3').classList.add('hidden');
  document.getElementById('s1').classList.remove('hidden');
  restartAnimation();
}

function renderSlots() {
  var d = document.getElementById('sdate').value;
  var busy = {};
  for (var i = 0; i < bookings.length; i++) {
    if (bookings[i].date === d) busy[bookings[i].time] = true;
  }

  var h = '';
  for (var hr = 9; hr < 18; hr++) {
    for (var mn = 0; mn < 60; mn += 15) {
      var t = (hr < 10 ? '0' : '') + hr + ':' + (mn < 10 ? '0' : '') + mn;
      var c = busy[t] ? 'slot busy' : 'slot';
      h += '<div class="' + c + '" onclick="pickSlot(this,\'' + t + '\')">' + t + '</div>';
    }
  }
  document.getElementById('slots').innerHTML = h;
  document.getElementById('sbox').classList.remove('hidden');
  selTime = null;
}

function pickSlot(el, t) {
  var all = document.querySelectorAll('.slot');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('sel');
  el.classList.add('sel');
  selTime = t;
}

function bookExam() {
  if (!selTime) { alert('Выберите время'); return; }
  var d = document.getElementById('sdate').value;
  var dd = new Date(d).toLocaleDateString('ru-RU');
  document.getElementById('cinfo').innerHTML = '<b style="color:#f5d742;">' + curStudent.fio + '</b><br> ' + dd + '<br>⏰ ' + selTime;
  document.getElementById('conf').classList.remove('hidden');
}

function confirmBook() {
  var d = document.getElementById('sdate').value;
  bookings.push({id: Date.now(), fio: curStudent.fio, date: d, time: selTime});
  save();
  document.getElementById('conf').classList.add('hidden');
  alert('Вы записаны на экзамен!\nУведомление отправлено менеджеру.');
  showStudent();
}

function closeConf() {
  document.getElementById('conf').classList.add('hidden');
}

load();
showStudent();
</script>
