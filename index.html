<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вектор — Автошкола</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #0a0a0a;
  color: #fff;
  padding: 20px;
  min-height: 100vh;
}

.box {
  max-width: 500px;
  margin: 0 auto;
  background: #141414;
  padding: 25px;
  border-radius: 12px;
  border: 1px solid #222;
}

.logo-wrap {
  text-align: center;
  margin-bottom: 20px;
}

.logo {
  width: 200px;
  height: auto;
}

h2 {
  font-size: 18px;
  margin: 20px 0 10px;
  color: #fff;
}

h2.yellow {
  color: #ffd700;
}

button {
  padding: 14px;
  width: 100%;
  margin: 8px 0;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-yellow {
  background: #ffd700;
  color: #000;
}

.btn-yellow:hover {
  background: #ffed4e;
  transform: translateY(-1px);
}

.btn-black {
  background: #1a1a1a;
  color: #ffd700;
  border: 2px solid #ffd700;
}

.btn-black:hover {
  background: #ffd700;
  color: #000;
}

.btn-danger {
  background: #ff3b3b;
  color: #fff;
  padding: 8px 12px;
  width: auto;
  font-size: 14px;
}

input {
  padding: 14px;
  width: 100%;
  margin: 8px 0;
  background: #0a0a0a;
  border: 2px solid #222;
  border-radius: 8px;
  color: #fff;
  font-size: 15px;
  box-sizing: border-box;
}

input:focus {
  outline: none;
  border-color: #ffd700;
}

input::placeholder {
  color: #555;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.tab {
  flex: 1;
  padding: 12px;
  background: #1a1a1a;
  color: #666;
  border: 2px solid #222;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  font-size: 15px;
}

.tab.active {
  background: #ffd700;
  color: #000;
  border-color: #ffd700;
}

.item {
  padding: 12px;
  background: #1a1a1a;
  margin: 5px 0;
  border-radius: 8px;
  border-left: 3px solid #ffd700;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.item span {
  color: #fff;
}

.item small {
  color: #888;
}

.slots {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin: 10px 0;
}

.slot {
  padding: 12px;
  text-align: center;
  background: #1a1a1a;
  border: 2px solid #333;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  color: #fff;
  font-weight: 600;
}

.slot:hover {
  border-color: #ffd700;
}

.slot.sel {
  background: #ffd700;
  color: #000;
  border-color: #ffd700;
}

.slot.busy {
  background: #0a0a0a;
  color: #444;
  text-decoration: line-through;
  cursor: not-allowed;
  border-color: #222;
}

.hidden { display: none !important; }

.modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal-box {
  background: #141414;
  padding: 25px;
  border-radius: 12px;
  max-width: 350px;
  width: 90%;
  border: 1px solid #ffd700;
  text-align: center;
}

.modal-box h2 {
  color: #ffd700;
  margin-bottom: 15px;
}

.modal-box p {
  color: #ccc;
  margin-bottom: 15px;
  line-height: 1.5;
}

.welcome {
  text-align: center;
  padding: 15px 0;
}

.welcome-icon {
  font-size: 50px;
  margin-bottom: 10px;
}

.divider {
  height: 1px;
  background: #222;
  margin: 15px 0;
}

.badge {
  display: inline-block;
  background: #ffd700;
  color: #000;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  margin-left: 8px;
}

/* АНИМАЦИЯ МАШИНЫ */
.car-animation {
  position: relative;
  height: 120px;
  margin-top: 20px;
  overflow: hidden;
}

.car {
  position: absolute;
  width: 80px;
  height: 40px;
  top: 50%;
  left: 100%;
  transform: translateY(-50%);
  animation: carMove 4s ease-out forwards;
}

@keyframes carMove {
  0% {
    left: 100%;
    transform: translateY(-50%) rotate(0deg);
  }
  40% {
    left: 50%;
    transform: translateY(-50%) rotate(0deg);
  }
  60% {
    left: 50%;
    transform: translateY(-50%) rotate(180deg);
  }
  100% {
    left: 50%;
    transform: translateY(-50%) rotate(180deg) translateX(-40px);
  }
}

.car svg {
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>

<div class="box">

  <!-- ЛОГОТИП -->
  <div class="logo-wrap">
    <svg class="logo" viewBox="0 0 220 80" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="10" width="60" height="60" rx="8" fill="#ffd700" transform="rotate(45 40 40)"/>
      <path d="M25 50 L35 30 L42 45 L55 20" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="48" font-size="32" font-weight="900" fill="#000">Vектор</text>
      <text x="80" y="65" font-size="11" fill="#666" letter-spacing="2">СЕТЬ АВТОШКОЛ</text>
    </svg>
  </div>

  <div class="tabs">
    <button class="tab" onclick="openAdmin()">🔒 АДМИН</button>
    <button class="tab active" onclick="showStudent()">🎓 УЧЕНИК</button>
  </div>

  <!-- АДМИН -->
  <div id="admin" class="hidden">
    <h2 class="yellow">Добавить ученика</h2>
    <input id="fio" placeholder="ФИО ученика">
    <button class="btn-yellow" onclick="addStudent()">Добавить</button>

    <div class="divider"></div>

    <h2>Список допущенных <span class="badge" id="stCount">0</span></h2>
    <div id="list"></div>

    <div class="divider"></div>

    <h2>Записи на экзамен <span class="badge" id="bkCount">0</span></h2>
    <div id="book"></div>

    <div class="divider"></div>

    <button class="btn-black" onclick="logout()">Выйти из админки</button>
  </div>

  <!-- УЧЕНИК: ШАГ 1 -->
  <div id="stu">
    <div id="s1">
      <div class="welcome">
        <div class="welcome-icon">🎓</div>
        <h2 class="yellow">Запись на экзамен по теории</h2>
        <p style="color:#888; margin-top:8px;">Введите ФИО для проверки допуска</p>
      </div>
      <input id="sfio" placeholder="Иванов Иван Иванович">
      <button class="btn-yellow" onclick="checkStudent()">Проверить допуск</button>
      
      <!-- АНИМАЦИЯ МАШИНЫ -->
      <div class="car-animation">
        <div class="car">
          <svg viewBox="0 0 80 40" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="15" width="60" height="20" rx="5" fill="#fff"/>
            <rect x="20" y="5" width="40" height="15" rx="3" fill="#fff"/>
            <circle cx="20" cy="35" r="6" fill="#333"/>
            <circle cx="60" cy="35" r="6" fill="#333"/>
            <rect x="25" y="8" width="12" height="10" fill="#87CEEB"/>
            <rect x="43" y="8" width="12" height="10" fill="#87CEEB"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- ШАГ 2 -->
    <div id="s2" class="hidden">
      <h2 class="yellow">Выберите дату экзамена</h2>
      <input type="date" id="sdate" onchange="renderSlots()">
      <div id="sbox" class="hidden">
        <h2>Свободное время</h2>
        <div id="slots" class="slots"></div>
        <button class="btn-yellow" onclick="bookExam()">Записаться</button>
      </div>
    </div>

    <!-- НЕ ДОПУЩЕН -->
    <div id="s3" class="hidden">
      <div class="welcome">
        <div class="welcome-icon">⚠️</div>
        <h2 class="yellow">Вы не допущены к экзамену</h2>
        <p style="color:#888; margin-top:8px;">Обратитесь к менеджеру автошколы «Вектор»</p>
      </div>
      <button class="btn-black" onclick="backToStart()">Назад</button>
    </div>
  </div>
</div>

<!-- МОДАЛКА ПАРОЛЯ -->
<div id="pwd" class="modal hidden">
  <div class="modal-box">
    <h2> Вход в админ-панель</h2>
    <p>Введите пароль</p>
    <input type="password" id="pw" placeholder="Пароль">
    <div id="err" style="color:#ff3b3b; margin:5px 0; font-size:14px;"></div>
    <button class="btn-yellow" onclick="checkPwd()">Войти</button>
    <button class="btn-black" onclick="closePwd()">Отмена</button>
  </div>
</div>

<!-- МОДАЛКА ПОДТВЕРЖДЕНИЯ -->
<div id="conf" class="modal hidden">
  <div class="modal-box">
    <h2>Подтвердить запись?</h2>
    <p id="cinfo"></p>
    <button class="btn-yellow" onclick="confirmBook()">Да, записаться</button>
    <button class="btn-black" onclick="closeConf()">Отмена</button>
  </div>
</div>

<script>
var students = [];
var bookings = [];
var loggedIn = false;
var curStudent = null;
var selTime = null;

function load() {
  students = JSON.parse(localStorage.getItem('st') || '[]');
  bookings = JSON.parse(localStorage.getItem('bk') || '[]');
  loggedIn = sessionStorage.getItem('adm') === '1';
}

function save() {
  localStorage.setItem('st', JSON.stringify(students));
  localStorage.setItem('bk', JSON.stringify(bookings));
}

function showAdmin() {
  document.getElementById('admin').classList.remove('hidden');
  document.getElementById('stu').classList.add('hidden');
  renderAdmin();
}

function showStudent() {
  document.getElementById('admin').classList.add('hidden');
  document.getElementById('stu').classList.remove('hidden');
  document.getElementById('s1').classList.remove('hidden');
  document.getElementById('s2').classList.add('hidden');
  document.getElementById('s3').classList.add('hidden');
  document.getElementById('sfio').value = '';
}

function openAdmin() {
  if (loggedIn) {
    showAdmin();
  } else {
    document.getElementById('pwd').classList.remove('hidden');
    document.getElementById('pw').value = '';
    document.getElementById('err').textContent = '';
  }
}

function checkPwd() {
  if (document.getElementById('pw').value === '0000') {
    loggedIn = true;
    sessionStorage.setItem('adm', '1');
    document.getElementById('pwd').classList.add('hidden');
    showAdmin();
  } else {
    document.getElementById('err').textContent = 'Неверный пароль';
  }
}

function closePwd() {
  document.getElementById('pwd').classList.add('hidden');
}

function logout() {
  loggedIn = false;
  sessionStorage.setItem('adm', '0');
  showStudent();
}

function addStudent() {
  var f = document.getElementById('fio').value.trim();
  if (!f) { alert('Введите ФИО'); return; }
  students.push({id: Date.now(), fio: f});
  save();
  document.getElementById('fio').value = '';
  renderAdmin();
  alert('Ученик добавлен');
}

function renderAdmin() {
  document.getElementById('stCount').textContent = students.length;
  document.getElementById('bkCount').textContent = bookings.length;

  var h = '';
  for (var i = 0; i < students.length; i++) {
    h += '<div class="item"><span>' + students[i].fio + '</span><button class="btn-danger" onclick="delSt(' + students[i].id + ')">×</button></div>';
  }
  document.getElementById('list').innerHTML = h || '<p style="color:#555;">Список пуст</p>';

  var h2 = '';
  for (var j = 0; j < bookings.length; j++) {
    var d = new Date(bookings[j].date).toLocaleDateString('ru-RU');
    h2 += '<div class="item"><span>' + bookings[j].fio + '<br><small>📅 ' + d + ' в ' + bookings[j].time + '</small></span></div>';
  }
  document.getElementById('book').innerHTML = h2 || '<p style="color:#555;">Записей нет</p>';
}

function delSt(id) {
  if (confirm('Удалить ученика?')) {
    students = students.filter(function(s) { return s.id !== id; });
    save();
    renderAdmin();
  }
}

function checkStudent() {
  var f = document.getElementById('sfio').value.trim().toLowerCase();
  if (!f) { alert('Введите ФИО'); return; }

  var found = null;
  for (var i = 0; i < students.length; i++) {
    if (students[i].fio.toLowerCase() === f) {
      found = students[i];
      break;
    }
  }

  if (found) {
    curStudent = found;
    document.getElementById('s1').classList.add('hidden');
    document.getElementById('s2').classList.remove('hidden');
    var t = new Date().toISOString().split('T')[0];
    document.getElementById('sdate').value = t;
    document.getElementById('sdate').min = t;
    renderSlots();
  } else {
    document.getElementById('s1').classList.add('hidden');
    document.getElementById('s3').classList.remove('hidden');
  }
}

function backToStart() {
  document.getElementById('s3').classList.add('hidden');
  document.getElementById('s1').classList.remove('hidden');
}

function renderSlots() {
  var d = document.getElementById('sdate').value;
  var busy = {};
  for (var i = 0; i < bookings.length; i++) {
    if (bookings[i].date === d) busy[bookings[i].time] = true;
  }

  var h = '';
  for (var hr = 9; hr < 18; hr++) {
    for (var mn = 0; mn < 60; mn += 15) {
      var t = (hr < 10 ? '0' : '') + hr + ':' + (mn < 10 ? '0' : '') + mn;
      var c = busy[t] ? 'slot busy' : 'slot';
      h += '<div class="' + c + '" onclick="pickSlot(this,\'' + t + '\')">' + t + '</div>';
    }
  }
  document.getElementById('slots').innerHTML = h;
  document.getElementById('sbox').classList.remove('hidden');
  selTime = null;
}

function pickSlot(el, t) {
  var all = document.querySelectorAll('.slot');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('sel');
  el.classList.add('sel');
  selTime = t;
}

function bookExam() {
  if (!selTime) { alert('Выберите время'); return; }
  var d = document.getElementById('sdate').value;
  var dd = new Date(d).toLocaleDateString('ru-RU');
  document.getElementById('cinfo').innerHTML = '<b style="color:#ffd700;">' + curStudent.fio + '</b><br>📅 ' + dd + '<br>⏰ ' + selTime;
  document.getElementById('conf').classList.remove('hidden');
}

function confirmBook() {
  var d = document.getElementById('sdate').value;
  bookings.push({id: Date.now(), fio: curStudent.fio, date: d, time: selTime});
  save();
  document.getElementById('conf').classList.add('hidden');
  alert('Вы записаны на экзамен!\nУведомление отправлено менеджеру.');
  showStudent();
}

function closeConf() {
  document.getElementById('conf').classList.add('hidden');
}

load();
showStudent();
</script>

</body>
</html>
