<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Автошкола</title>
<style>
body { font-family: Arial; padding: 20px; background: #f5f5f5; margin: 0; }
.box { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
h1 { font-size: 22px; text-align: center; }
h2 { font-size: 18px; margin: 20px 0 10px; }
button { padding: 12px; width: 100%; margin: 8px 0; border: none; border-radius: 6px; font-size: 16px; }
.btn { background: #667eea; color: white; }
.btn-del { background: #ff4757; color: white; padding: 8px; width: auto; }
input { padding: 12px; width: 100%; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
.tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.tab { flex: 1; padding: 12px; background: #e0e0e0; border: none; border-radius: 6px; font-weight: bold; }
.tab.active { background: #667eea; color: white; }
.item { padding: 10px; background: #f8f9fa; margin: 5px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 10px 0; }
.slot { padding: 10px; text-align: center; border: 2px solid #ddd; border-radius: 6px; }
.slot.sel { background: #667eea; color: white; }
.slot.busy { background: #eee; color: #999; text-decoration: line-through; }
.hidden { display: none !important; }
.modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal-box { background: white; padding: 25px; border-radius: 10px; max-width: 350px; width: 90%; }
</style>
</head>
<body>

<div class="box">
  <h1>🚗 Автошкола</h1>
  
  <div class="tabs">
    <button class="tab" onclick="openAdmin()">Админ</button>
    <button class="tab active" onclick="showStudent()">Ученик</button>
  </div>

  <div id="admin" class="hidden">
    <h2>Добавить ученика</h2>
    <input id="fio" placeholder="ФИО">
    <button class="btn" onclick="addStudent()">Добавить</button>
    <h2>Список:</h2>
    <div id="list"></div>
    <h2>Записи:</h2>
    <div id="book"></div>
    <button class="btn" onclick="logout()" style="background:#ff4757;">Выйти</button>
  </div>

  <div id="stu">
    <div id="s1">
      <div style="text-align:center; padding:20px 0;">
        <div style="font-size:48px;"></div>
        <h2>Запись на экзамен</h2>
        <p style="color:#666;">Введите ФИО</p>
      </div>
      <input id="sfio" placeholder="ФИО">
      <button class="btn" onclick="checkStudent()">Проверить допуск</button>
    </div>
    
    <div id="s2" class="hidden">
      <h2>Выберите дату</h2>
      <input type="date" id="sdate" onchange="renderSlots()">
      <div id="sbox" class="hidden">
        <h2>Время:</h2>
        <div id="slots" class="slots"></div>
        <button class="btn" onclick="bookExam()">Записаться</button>
      </div>
    </div>
    
    <div id="s3" class="hidden">
      <div style="text-align:center; padding:20px 0;">
        <div style="font-size:48px;">⚠️</div>
        <h2 style="color:#ff4757;">Не допущен</h2>
        <p>Обратитесь к менеджеру</p>
      </div>
      <button class="btn" onclick="backToStart()">Назад</button>
    </div>
  </div>
</div>

<div id="pwd" class="modal hidden">
  <div class="modal-box">
    <h2>🔐 Пароль</h2>
    <input type="password" id="pw" placeholder="Пароль">
    <div id="err" style="color:red;"></div>
    <button class="btn" onclick="checkPwd()">Войти</button>
    <button class="btn" onclick="closePwd()" style="background:#ccc;">Отмена</button>
  </div>
</div>

<div id="conf" class="modal hidden">
  <div class="modal-box">
    <h2>Подтвердить?</h2>
    <p id="cinfo"></p>
    <button class="btn" onclick="confirmBook()">Да</button>
    <button class="btn" onclick="closeConf()" style="background:#ccc;">Нет</button>
  </div>
</div>

<script>
var students = [];
var bookings = [];
var loggedIn = false;
var curStudent = null;
var selTime = null;

function load() {
  students = JSON.parse(localStorage.getItem('st') || '[]');
  bookings = JSON.parse(localStorage.getItem('bk') || '[]');
  loggedIn = sessionStorage.getItem('adm') === '1';
}

function save() {
  localStorage.setItem('st', JSON.stringify(students));
  localStorage.setItem('bk', JSON.stringify(bookings));
}

function showAdmin() {
  document.getElementById('admin').classList.remove('hidden');
  document.getElementById('stu').classList.add('hidden');
  renderAdmin();
}

function showStudent() {
  document.getElementById('admin').classList.add('hidden');
  document.getElementById('stu').classList.remove('hidden');
  document.getElementById('s1').classList.remove('hidden');
  document.getElementById('s2').classList.add('hidden');
  document.getElementById('s3').classList.add('hidden');
  document.getElementById('sfio').value = '';
}

function openAdmin() {
  if (loggedIn) {
    showAdmin();
  } else {
    document.getElementById('pwd').classList.remove('hidden');
    document.getElementById('pw').value = '';
    document.getElementById('err').textContent = '';
  }
}

function checkPwd() {
  if (document.getElementById('pw').value === '0000') {
    loggedIn = true;
    sessionStorage.setItem('adm', '1');
    document.getElementById('pwd').classList.add('hidden');
    showAdmin();
  } else {
    document.getElementById('err').textContent = 'Неверно';
  }
}

function closePwd() {
  document.getElementById('pwd').classList.add('hidden');
}

function logout() {
  loggedIn = false;
  sessionStorage.setItem('adm', '0');
  showStudent();
}

function addStudent() {
  var f = document.getElementById('fio').value.trim();
  if (!f) { alert('Введите ФИО'); return; }
  students.push({id: Date.now(), fio: f});
  save();
  document.getElementById('fio').value = '';
  renderAdmin();
  alert('Добавлено');
}

function renderAdmin() {
  var h = '';
  for (var i = 0; i < students.length; i++) {
    h += '<div class="item"><span>' + students[i].fio + '</span><button class="btn-del" onclick="delSt(' + students[i].id + ')">×</button></div>';
  }
  document.getElementById('list').innerHTML = h || 'Пусто';
  
  var h2 = '';
  for (var j = 0; j < bookings.length; j++) {
    var d = new Date(bookings[j].date).toLocaleDateString('ru-RU');
    h2 += '<div class="item">' + bookings[j].fio + ' - ' + d + ' ' + bookings[j].time + '</div>';
  }
  document.getElementById('book').innerHTML = h2 || 'Пусто';
}

function delSt(id) {
  if (confirm('Удалить?')) {
    students = students.filter(function(s) { return s.id !== id; });
    save();
    renderAdmin();
  }
}

function checkStudent() {
  var f = document.getElementById('sfio').value.trim().toLowerCase();
  if (!f) { alert('Введите ФИО'); return; }
  
  var found = null;
  for (var i = 0; i < students.length; i++) {
    if (students[i].fio.toLowerCase() === f) {
      found = students[i];
      break;
    }
  }
  
  if (found) {
    curStudent = found;
    document.getElementById('s1').classList.add('hidden');
    document.getElementById('s2').classList.remove('hidden');
    var t = new Date().toISOString().split('T')[0];
    document.getElementById('sdate').value = t;
    document.getElementById('sdate').min = t;
    renderSlots();
  } else {
    document.getElementById('s1').classList.add('hidden');
    document.getElementById('s3').classList.remove('hidden');
  }
}

function backToStart() {
  document.getElementById('s3').classList.add('hidden');
  document.getElementById('s1').classList.remove('hidden');
}

function renderSlots() {
  var d = document.getElementById('sdate').value;
  var busy = {};
  for (var i = 0; i < bookings.length; i++) {
    if (bookings[i].date === d) busy[bookings[i].time] = true;
  }
  
  var h = '';
  for (var hr = 9; hr < 18; hr++) {
    for (var mn = 0; mn < 60; mn += 15) {
      var t = (hr < 10 ? '0' : '') + hr + ':' + (mn < 10 ? '0' : '') + mn;
      var c = busy[t] ? 'slot busy' : 'slot';
      h += '<div class="' + c + '" onclick="pickSlot(this,\'' + t + '\')">' + t + '</div>';
    }
  }
  document.getElementById('slots').innerHTML = h;
  document.getElementById('sbox').classList.remove('hidden');
  selTime = null;
}

function pickSlot(el, t) {
  var all = document.querySelectorAll('.slot');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('sel');
  el.classList.add('sel');
  selTime = t;
}

function bookExam() {
  if (!selTime) { alert('Выберите время'); return; }
  var d = document.getElementById('sdate').value;
  var dd = new Date(d).toLocaleDateString('ru-RU');
  document.getElementById('cinfo').innerHTML = curStudent.fio + '<br>' + dd + '<br>' + selTime;
  document.getElementById('conf').classList.remove('hidden');
}

function confirmBook() {
  var d = document.getElementById('sdate').value;
  bookings.push({id: Date.now(), fio: curStudent.fio, date: d, time: selTime});
  save();
  document.getElementById('conf').classList.add('hidden');
  alert('Записано!');
  showStudent();
}

function closeConf() {
  document.getElementById('conf').classList.add('hidden');
}

load();
showStudent();
</script>

</body>
</html>
